<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mappls Map & Search</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Mappls Vector Map SDK (প্লাগইন ছাড়া, যাতে টোকেন এরর না আসে) -->
  <script src="https://apis.mappls.com/advancedmaps/api/mvurtbbkrmltvdcpnblczfijpxtwmzqkhpmz/map_sdk?layer=vector&v=3.0&callback=initMap" defer></script>
  <script src="app.js" defer></script>
</head>
<body>

  <!-- ম্যাপের ওপর ভাসমান সার্চ বক্স -->
  <div class="search-box-wrapper">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="সার্চ করুন (যেমন: Budge Budge 2 BDO)..." 
      autocomplete="off" 
    />
    <ul id="suggestBox" class="suggest-box"></ul>
  </div>

  <!-- Mappls মানচিত্র -->
  <div id="map"></div>

</body>
</html>
