<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mappls Map & Search</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Mappls আসল ভেক্টর SDK -->
  <script src="https://apis.mappls.com/advancedmaps/api/e4313b0c5f3e824b26f0623f91d4334e/map_sdk?layer=vector&v=3.0&callback=initMap" defer></script>
  <!-- v=101 দিয়ে ব্রাউজারের পুরনো ক্যাশ বাইপাস করা হলো -->
  <script src="app.js?v=101" defer></script>
</head>
<body>

  <!-- সার্চ বার -->
  <div class="search-box-wrapper">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="সার্চ করুন (যেমন: Budge Budge College)..." 
      autocomplete="off" 
    />
    <ul id="suggestBox" class="suggest-box"></ul>
  </div>

  <!-- ম্যাপ কন্টেইনার -->
  <div id="map"></div>

</body>
</html>
