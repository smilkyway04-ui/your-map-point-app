<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mappls Map & Search</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Mappls আসল Map SDK (যেটি দিয়ে প্রথমে ম্যাপ এসেছিল) -->
  <script src="https://apis.mappls.com/advancedmaps/api/e4313b0c5f3e824b26f0623f91d4334e/map_sdk.js"></script>
</head>
<body>

  <!-- ভাসমান সার্চ বার -->
  <div class="search-box-wrapper">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="সার্চ করুন (যেমন: Budge Budge 2)..." 
      autocomplete="off" 
    />
    <ul id="suggestBox" class="suggest-box"></ul>
  </div>

  <!-- ম্যাপ কন্টেইনার -->
  <div id="map"></div>

  <script src="app.js"></script>
</body>
</html>
