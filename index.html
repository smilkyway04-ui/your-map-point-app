<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mappls Map & Search</title>
  <link rel="stylesheet" href="style.css" />

  <!-- ১. Mappls আসল ভেক্টর SDK -->
  <script src="https://apis.mappls.com/advancedmaps/api/e4313b0c5f3e824b26f0623f91d4334e/map_sdk?layer=vector&v=3.0&callback=initMap"></script>
  
  <!-- ২. Mappls অফিশিয়াল প্লাগইন SDK (eLoc দিয়ে নিখুঁত বিল্ডিং লোকেশনের জন্য বাধ্যতামূলক) -->
  <script src="https://apis.mappls.com/advancedmaps/api/e4313b0c5f3e824b26f0623f91d4334e/map_sdk_plugins?v=3.0"></script>
  
  <!-- ৩. আপনার অ্যাপ কোড (v=105 দিয়ে ক্যাশ বাইপাস) -->
  <script src="app.js?v=105" defer></script>
</head>
<body>

  <!-- সার্চ বক্স -->
  <div class="search-box-wrapper">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="সার্চ করুন (যেমন: Budge Budge College)..." 
      autocomplete="off" 
    />
    <ul id="suggestBox" class="suggest-box"></ul>
  </div>

  <!-- ম্যাপ -->
  <div id="map"></div>

</body>
</html>
